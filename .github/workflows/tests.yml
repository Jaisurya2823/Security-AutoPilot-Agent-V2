name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Lint (unused imports / undefined names)
        run: python -m pyflakes src/ app.py cli.py main.py

      - name: Run tests
        env:
          # Tests mock every Groq/OSV.dev/GitHub network call at the
          # transport boundary, so a real key is never required — this
          # exists only in case a future test accidentally tries a real
          # call, so it fails on a clearly-fake key instead of hanging.
          GROQ_API_KEY: "gsk_ci_placeholder_not_a_real_key"
        run: python -m pytest -v
